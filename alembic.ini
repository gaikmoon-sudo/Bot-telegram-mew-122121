[alembic]
# Migration scripts are stored in the repository's alembic/ directory.
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# This value is intentionally empty. alembic/env.py loads DATABASE_URL from
# config.py and sets the asyncpg URL dynamically at runtime.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S