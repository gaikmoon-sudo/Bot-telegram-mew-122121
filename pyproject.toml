[project]
name = "telegram-academy"
version = "3.0.0"
description = "Telegram Academy bot with persistent learning progress, quiz polls and production deployment support."
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiogram>=3.13,<4.0",
  "redis>=5.0,<7.0",
  "sentry-sdk>=2.0,<3.0",
    "openai>=1.100,<2.0",
  "aiohttp>=3.9,<4.0",
  "SQLAlchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "replit.object-storage>=1.0.2,<2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "aiosqlite>=0.20,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
